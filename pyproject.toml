[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topo-manim"
version = "0.1.0"
description = "Animations Manim pour illustrer le cours de topologie L3"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "manim>=0.18",
    "numpy",
    # srt is a transitive dep of manim (manim.scene.scene imports it at module load),
    # but Manim 0.20.x sometimes fails to install it cleanly through uv resolution
    # (notably on Windows / OneDrive contexts). We pin it explicitly to avoid the
    # ModuleNotFoundError: No module named 'srt' that bites otherwise.
    "srt",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scenes*"]
exclude = ["legacy*", "tests*", "videos*", "Latex*", "references*", "media*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["media", "videos", "Latex", "references", "legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "E741",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
"src/**/__init__.py" = ["F401", "F403", "F405"]
"scenes/**/__init__.py" = ["F401", "F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false
